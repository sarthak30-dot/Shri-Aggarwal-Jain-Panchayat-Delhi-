<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Premium Gold Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB0" />
      <stop offset="35%" stop-color="#FFD27A" />
      <stop offset="70%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crescent and Three Dots (Siddhashila) -->
  <path d="M38 12 C 45 15, 55 15, 62 12 C 57 18, 43 18, 38 12 Z" fill="url(#gold-grad)" />
  <circle cx="50" cy="8" r="1.8" fill="url(#gold-grad)" />
  <circle cx="43" cy="18" r="1.5" fill="url(#gold-grad)" />
  <circle cx="50" cy="18" r="1.5" fill="url(#gold-grad)" />
  <circle cx="57" cy="18" r="1.5" fill="url(#gold-grad)" />

  <!-- Hand Outline (Abhaya Mudra) -->
  <path d="M50 85 
           C 40 85, 34 80, 34 70 
           C 34 62, 32 50, 31 43
           C 30.5 40, 31 38, 33 38
           C 35 38, 36.5 40, 37 45
           L 38 52
           C 38 40, 39 30, 40.5 25
           C 41 23, 42.5 23, 43.5 25
           C 45 28, 45.5 38, 45.5 50
           L 45.5 55
           C 45.5 35, 47 24, 49 20
           C 49.5 19, 51 19, 51.5 20
           C 53.5 24, 54 36, 54 53
           L 54 55
           C 54 38, 55.5 25, 57 23
           C 57.5 22, 59 22, 59.5 23
           C 61 26, 61.5 38, 61.5 53
           L 61.5 56
           C 61.5 42, 63.5 35, 65 35
           C 66 35, 67 36, 67 40
           C 67 48, 66 60, 66 68
           C 66 76, 62 85, 50 85 Z" 
        fill="none" 
        stroke="url(#gold-grad)" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Wheel (Dharma Chakra) in Palm -->
  <circle cx="50" cy="62" r="12" fill="none" stroke="url(#gold-grad)" stroke-width="2.2" />
  <circle cx="50" cy="62" r="4.5" fill="none" stroke="url(#gold-grad)" stroke-width="1.2" />

  <!-- Spokes (represented elegantly) -->
  <g stroke="url(#gold-grad)" stroke-width="1">
    <line x1="50" y1="50" x2="50" y2="74" />
    <line x1="38" y1="62" x2="62" y2="62" />
    <line x1="41.5" y1="53.5" x2="58.5" y2="70.5" />
    <line x1="41.5" y1="70.5" x2="58.5" y2="53.5" />
  </g>

  <!-- Ahimsa text in center of wheel (stylized A) -->
  <text x="50" y="64" font-family="Cinzel, serif" font-weight="bold" font-size="6" fill="url(#gold-grad)" text-anchor="middle">अ</text>
</svg>
